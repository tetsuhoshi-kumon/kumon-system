<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kumon Center Management System</title>
  <style>
    :root {
      --primary: #2980b9;
      --secondary: #27ae60;
      --warning: #e67e22;
      --danger: #e74c3c;
      --dark: #2c3e50;
    }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: #eef2f5; color: #333; }
    header { background: var(--dark); color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 1.4rem; }
    nav { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    nav button { background: #34495e; color: white; border: none; padding: 0.6rem 1rem; border-radius: 4px; cursor: pointer; font-weight: bold; }
    nav button.active { background: var(--primary); }
    .container { max-width: 1200px; margin: 1.5rem auto; padding: 0 1rem; }
    .view-card { background: white; border-radius: 8px; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 1.5rem; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; padding: 0.75rem; border-bottom: 1px solid #ddd; vertical-align: middle; }
    th { background: #f1f4f6; }

    input, select, button { padding: 0.6rem; border-radius: 4px; border: 1px solid #ccc; font-size: 1rem; }
    .btn-action { background: var(--primary); color: white; border: none; cursor: pointer; font-weight: bold; }
    .btn-danger { background: var(--danger); color: white; border: none; cursor: pointer; }
    .btn-success { background: var(--secondary); color: white; border: none; cursor: pointer; }
    .btn-warning { background: var(--warning); color: white; border: none; cursor: pointer; }

    #scanToast {
      position: fixed; top: -120px; left: 50%; transform: translateX(-50%);
      z-index: 9999; min-width: 380px; max-width: 90vw; padding: 1rem 1.5rem;
      border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.25); color: white;
      font-size: 1.15rem; font-weight: 700; display: flex; align-items: center; gap: 1rem;
      transition: top 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none;
    }
    #scanToast.toast-show { top: 20px; }
    #scanToast.toast-success { background: linear-gradient(135deg, #27ae60, #2ecc71); border-left: 6px solid #1e8449; }
    #scanToast.toast-error { background: linear-gradient(135deg, #c0392b, #e74c3c); border-left: 6px solid #922b21; }

    .progress-bar-container { width: 140px; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; margin-top: 4px; }
    .progress-bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s ease; }
    .fill-blue { background: #3498db; }
    .fill-amber { background: #f39c12; }
    .fill-red { background: #e74c3c; }

    .student-link { color: #2980b9; text-decoration: underline; cursor: pointer; font-weight: 700; }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 10000; }
    .modal-card { background: white; border-radius: 8px; width: 90%; max-width: 650px; max-height: 85vh; overflow-y: auto; padding: 1.5rem; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }

    .time-badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 0.85rem; }
    .time-ok { background: #e8f8f0; color: #27ae60; }
    .time-warn { background: #fef5e7; color: #e67e22; border: 1px solid #f39c12; }
    .time-alert { background: #fdebd0; color: #c0392b; border: 1px solid #e74c3c; }

    .subj-pill { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 0.8rem; font-weight: 700; }
    .subj-math { background-color: #ebf5fb; color: #1d6fa5; border: 1px solid #aed6f1; }
    .subj-reading { background-color: #fdeed9; color: #d93829; border: 1px solid #fadbd8; }
  </style>
</head>
<body>
<div id="scanToast"><span id="toastIcon"></span><span id="toastMsg"></span></div>
<header><h1>Kumon Center Kiosk</h1></header>
<div class="container">
  <div class="view-card">
    <h2>Scan In / Scan Out</h2>
    <input type="text" id="scanInput" placeholder="Scan ID or type name..." autofocus />
    <button class="btn-action" onclick="handleScan()">Submit</button>
  </div>
</div>
<script>
  function handleScan() {
    alert("Kiosk system active.");
  }
</script>
</body>
</html>
